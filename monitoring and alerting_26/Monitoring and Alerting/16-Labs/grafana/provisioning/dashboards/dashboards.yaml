apiVersion: 1

providers:
  - name: lab-dashboards
    orgId: 1
    folder: Labs
    folderUid: labs
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30        # hot-reloads JSON changes from disk
    allowUiUpdates: true             # edit in the UI to experiment; file updates win
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
