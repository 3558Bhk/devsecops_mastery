# blackbox_exporter configuration — https://github.com/prometheus/blackbox_exporter
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []            # defaults to 2xx
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
      fail_if_not_ssl: false
      # basic_auth:
      #   username: probe
      #   password_file: /etc/blackbox/secrets/probe-pass

  http_2xx_post:
    prober: http
    timeout: 10s
    http:
      method: POST
      headers:
        Content-Type: application/json
      body: '{"ping":true}'
      valid_status_codes: [200, 201, 202, 204]

  http_5xx_expected:                     # probe a URL you EXPECT to fail
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [404, 500]

  http_tls:
    prober: http
    timeout: 10s
    http:
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: false

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      # tls: true                        # for TLS-terminating TCP endpoints

  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
      # requires NET_RAW capability on the container/host:
      #   cap_add: [NET_RAW] in docker-compose

  dns_example:
    prober: dns
    timeout: 5s
    dns:
      query_name: "example.com"
      query_type: "A"
      preferred_ip_protocol: ip4
      recursion_desired: true

  grpc_health:
    prober: grpc
    timeout: 5s
    grpc:
      preferred_ip_protocol: ip4
      tls: false
