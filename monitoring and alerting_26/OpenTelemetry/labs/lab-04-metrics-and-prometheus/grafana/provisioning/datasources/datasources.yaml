apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: lab04-prom
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 10s
      # ★ METRIC -> TRACE. Both label names, because the exemplar's trace-ID
      #   label depends on who attached it: Tempo's generator uses `traceID`,
      #   the OTel SDK / Collector remote-write path uses `trace_id`.
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: lab04-tempo
          urlDisplayLabel: "View trace"
        - name: trace_id
          datasourceUid: lab04-tempo
          urlDisplayLabel: "View trace"

  - name: Tempo
    type: tempo
    uid: lab04-tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      httpMethod: GET
      search:
        hide: false
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: lab04-prom
      tracesToMetrics:
        datasourceUid: lab04-prom
        tags:
          - key: service.name
            value: service_name
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
