apiVersion: 1

# Lab 03 needs no cross-signal wiring — there are no logs and no metrics
# generator. The whole lab is read from the Collector's own sampling telemetry.
datasources:
  - name: Prometheus
    type: prometheus
    uid: lab03-prom
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 5s

  - name: Tempo
    type: tempo
    uid: lab03-tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      httpMethod: GET
      search:
        hide: false
      nodeGraph:
        enabled: true
      tracesToMetrics:
        datasourceUid: lab03-prom
        tags:
          - key: service.name
            value: service
