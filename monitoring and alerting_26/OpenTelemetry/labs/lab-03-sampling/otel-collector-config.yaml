# =============================================================================
# Lab 03 — Head vs tail sampling, side by side
# =============================================================================
# MACHINE-VALIDATED against otelcol-contrib v0.161.0:
#   otelcol-contrib validate --config=otel-collector-config.yaml
#
# TWO collectors in one lab, so you can compare the results directly:
#   collector-head  -> head sampling in the SDK (probabilistic, blind, cheap)
#   collector-tail  -> tail sampling in the Collector (informed, stateful)
# Both write to the SAME Tempo with different service names, so a single
# TraceQL query shows the difference.
#
# Companion reading: ../../10-sampling.md  (read this first — it explains every
#                    number below), ../../14-scale-cost-and-cardinality.md
# =============================================================================

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  # ★★ TWO INSTANCES OF THE SAME RECEIVER TYPE, on different ports.
  #   `type/name` is how you run one component twice with different config.
  #   A single otlp receiver cannot be split by port, so each sampling path gets
  #   its own instance and its own port:
  #     otlp/head -> :4317 (gRPC) / :4318 (HTTP)   used by app-head
  #     otlp/tail -> :4417 (gRPC) / :4418 (HTTP)   used by app-tail
  #   That is what lets ONE Collector host two independent pipelines fed by two
  #   different applications.
  otlp/head:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  otlp/tail:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4417
      http:
        endpoint: 0.0.0.0:4418

processors:
  # ★★ FIRST, always. Tail sampling is the most memory-hungry processor there
  #    is; without the limiter the container OOMKills instead of shedding.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  # ---------------------------------------------------------------------------
  # HEAD SAMPLING (in the Collector, for comparison).
  #
  # ★ In production head sampling belongs in the SDK, not here — it is cheaper
  #   to drop a span before it is serialised and sent. This processor exists in
  #   the lab so you can see head sampling's fatal flaw with your own eyes:
  #   IT DECIDES WITHOUT SEEING THE TRACE.
  #
  # ★★ `parentbased_` is not optional. A bare probabilistic_sampler re-rolls
  #    the dice for every span, so a kept parent can have dropped children and
  #    you get FRAGMENTED traces. parentbased propagates the root decision
  #    down the tree. See ../../03-context-and-propagation.md
  # ---------------------------------------------------------------------------
  probabilistic_sampler/head:
    sampling_percentage: 10

    # ★ mode: hash_seed is the DEFAULT and the one you want. The decision is a
    #   hash of the trace ID, so it is DETERMINISTIC per trace and consistent
    #   across every Collector replica in a tier — not a random roll per span.
    #   Other modes: "proportional" and "equalizing".
    mode: hash_seed

    # ★★ A 32-bit INTEGER, not a string. Verified error if you guess:
    #     'probabilisticsamplerprocessor.Config' has invalid keys: hash_salt
    #   `hash_salt` belongs to tail_sampling's probabilistic POLICY, which is a
    #   different component with a different schema. Easy to conflate.
    #
    #   ★ "all collectors for a given tier (e.g. behind the same load balancer)
    #      should have the same hash_seed" — otherwise each replica keeps a
    #      different 10% and your effective sample rate is meaningless.
    hash_seed: 30303

    # ★ fail_closed defaults to TRUE: items with sampling-related errors are
    #   REJECTED. That is the safe default for a sampling decision — an item you
    #   cannot evaluate should not silently become "kept".
    fail_closed: true

    # ★ sampling_precision = number of hex digits encoding the threshold.
    #   Default 4, permitted 1..14. Higher precision = finer control at small
    #   percentages, at the cost of a larger threshold encoding.
    sampling_precision: 4

  # ---------------------------------------------------------------------------
  # TAIL SAMPLING — the interesting one.
  #
  # ★★ THE DEFAULT OUTCOME IS "NOT SAMPLED". If no policy matches, the trace is
  #    DROPPED. Every config here therefore ends with a catch-all baseline.
  #    Forgetting that is the #1 tail-sampling mistake: you enable it, keep 100%
  #    of errors and slow traces, and silently lose ALL normal traffic.
  # ---------------------------------------------------------------------------
  tail_sampling:
    # ★ How long to wait for a trace to complete before deciding.
    #   Longer = more complete traces + more memory. Shorter = faster decisions,
    #   but spans arriving after the decision are "late" and handled by the
    #   decision cache (or dropped).
    decision_wait: 10s

    # ★ In-memory circular buffer of traces awaiting a decision.
    #   Memory ≈ num_traces × average trace size.
    #   50,000 × ~10 KB ≈ 500 MB. Sized against the 2Gi container limit below.
    num_traces: 50000

    # Hint for pre-allocating the policy evaluator. Under-estimating it is fine;
    # wildly over-estimating wastes memory.
    expected_new_traces_per_sec: 500

    # ★ Drop a trace BEFORE its decision if it exceeds this, to bound memory.
    #   A 6-hour batch job emitted as one span will hit it. 0 disables.
    maximum_trace_size_bytes: 5242880     # 5 MiB

    # ★★ DECISION CACHES — BOTH DEFAULT TO 0 (= INACTIVE).
    #   With no cache, a span arriving after its trace's buffer entry was evicted
    #   gets a FRESH, INDEPENDENT decision — so you keep some spans of a trace
    #   you already decided to drop. That is how you end up with partial traces
    #   and no idea why. Set these well above num_traces.
    decision_cache:
      sampled_cache_size: 500000
      non_sampled_cache_size: 500000

    # ★ sampling_strategy: trace-complete (default) evaluates the whole trace on
    #   the timer path. span-ingest decides at ingest and REJECTS stateful
    #   policies. trace-complete is what you want here.
    sampling_strategy: trace-complete

    # ★ false = a shutting-down Collector decides on PARTIAL data rather than
    #   dropping. Usually what you want: an incomplete trace beats no trace.
    drop_pending_traces_on_shutdown: false

    # ★ Parallel event loops, routed by trace-ID hash. Reduces contention when
    #   decision_timer_latency exceeds ~1s.
    #   CAUTION: num_traces, cache sizes and per-second rate limits are DIVIDED
    #   evenly across shards; burst_capacity is NOT. Enforcement becomes
    #   approximate for limits smaller than num_shards. INCOMPATIBLE with
    #   tail_storage. Left at the default 1 here so the lab is predictable —
    #   see Exercise 6 for what happens when you raise it.
    num_shards: 1

    # ★★ Policies are evaluated IN ORDER. composite budgets across them so one
    #    noisy service cannot starve the error budget.
    policies:
      # 1. ALWAYS keep errors. Non-negotiable — this is why you tail-sample.
      - name: errors-status
        type: status_code
        status_code:
          status_codes: [ERROR]

      # 2. ALWAYS keep slow traces.
      #    ★ latency is measured earliest-start -> latest-end, IGNORING interior
      #      gaps. A trace with one 3s span and 200 fast ones still counts.
      - name: slow
        type: latency
        latency:
          threshold_ms: 1000

      # 3. Keep anything the app explicitly flagged, e.g. a support ticket ID or
      #    an internal user. This is the policy head sampling CANNOT express.
      - name: force-keep
        type: boolean_attribute
        boolean_attribute:
          key: sampling.force_keep
          value: true

      # 4. Keep traces from a specific customer/tenant under investigation.
      - name: tenant-debug
        type: string_attribute
        string_attribute:
          key: tenant.id
          values: [acme-debug]

      # 5. ★★ THE BUDGET. composite enforces a global span rate and allocates it
      #    by percentage, in policy_order. Without this, a retry storm of errors
      #    can consume your entire budget and you lose the slow traces.
      #
      #    ★ max_total_spans_per_second is a PER-INSTANCE limit. If you scale to
      #      N replicas behind a load_balancing exporter, your effective budget
      #      is N × this value. Budget accordingly.
      - name: budget
        type: composite
        composite:
          max_total_spans_per_second: 2000
          policy_order: [errors-status, slow, baseline-probabilistic]
          composite_sub_policy:
            - name: errors-status
              type: status_code
              status_code:
                status_codes: [ERROR]
            - name: slow
              type: latency
              latency:
                threshold_ms: 1000
            # ★ The baseline: a small probabilistic share of ordinary traffic,
            #   so you can still see what "normal" looks like.
            - name: baseline-probabilistic
              type: probabilistic
              probabilistic:
                sampling_percentage: 10
                hash_salt: "lab-03-baseline"
          # ★ rate_allocation percentages must sum to <= 100.
          rate_allocation:
            - policy: errors-status
              percent: 40
            - policy: slow
              percent: 30
            - policy: baseline-probabilistic
              percent: 30

    # ★★ AND THEN NOTHING ELSE MATCHES -> DROPPED. That is the default outcome.
    #    The composite's baseline-probabilistic is what prevents total loss here.

  # Tag kept traces so you can compare the two paths in Tempo with one query.
  resource/label-tail:
    attributes:
      - key: lab.sampling.path
        value: tail
        action: upsert

  resource/label-head:
    attributes:
      - key: lab.sampling.path
        value: head
        action: upsert

  batch:
    send_batch_size: 4096
    timeout: 5s

connectors:
  # ★★ span_metrics is how you MEASURE the sampling difference numerically.
  #   Without it you can only eyeball Tempo. With it you get calls/duration per
  #   service, and `service_name` separates the two paths in one query.
  #
  #   ★ Placed AFTER the samplers in each pipeline, so it counts only KEPT spans.
  #     That is exactly what you want to measure — but be aware it means these
  #     metrics are themselves sampled. For unsampled RED metrics, put a second
  #     connector instance on a pipeline BEFORE the sampler.
  span_metrics:
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
    # ★ service.name and service.instance.id are DEFAULT dimensions — listing
    #   them again fails validation with "duplicate dimension name".
    dimensions:
      - name: http.route
      - name: http.response.status_code
      # ★ Which sampling path produced this span. Set by the resource processors.
      - name: lab.sampling.path
    aggregation_cardinality_limit: 1000
    aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE

exporters:
  # ★ Both paths write to the SAME Tempo. Distinguished by service.name, which
  #   the two app containers set differently.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true            # ★ OFF by default
      queue_size: 5000
      num_consumers: 10
    retry_on_failure:
      enabled: true            # ★ OFF by default
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  prometheus:
    endpoint: 0.0.0.0:8889
    translation_strategy: UnderscoreEscapingWithSuffixes

  debug:
    verbosity: basic
    sampling_initial: 2
    sampling_thereafter: 500

service:
  extensions: [health_check]

  telemetry:
    logs:
      level: info
    metrics:
      # ★ detailed is REQUIRED to get the per-policy sampling metrics.
      #   With `basic` you cannot see which policy kept what, which is the
      #   entire point of the lab.
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0     # ★ default is localhost — invisible to Prometheus
                port: 8888

  pipelines:
    # -------------------------------------------------------------------------
    # ★★ TWO SEPARATE TRACE PIPELINES IN ONE COLLECTOR.
    #
    #   A pipeline is identified by its name, so `traces/head` and `traces/tail`
    #   are independent. The app containers choose which to use by connecting to
    #   a different OTLP port — but a single receiver cannot be split by port
    #   alone, so we use TWO otlp receiver INSTANCES instead.
    #
    #   ★ `type/name` syntax creates instances of the same component type. This
    #     is the mechanism for running one component twice with different config.
    # -------------------------------------------------------------------------
    traces/head:
      receivers: [otlp/head]
      processors: [memory_limiter, probabilistic_sampler/head, resource/label-head, batch]
      exporters: [otlp/tempo, span_metrics, debug]

    traces/tail:
      receivers: [otlp/tail]
      processors: [memory_limiter, tail_sampling, resource/label-tail, batch]
      exporters: [otlp/tempo, span_metrics, debug]

    # Metrics from both apps, unsampled — you always want 100% of metrics.
    # ★ Sampling metrics is almost never right: a metric IS the aggregate.
    metrics:
      receivers: [otlp/head, otlp/tail, span_metrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
